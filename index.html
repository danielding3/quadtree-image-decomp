<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadtree Image Decomposition</title>
  </head>
  <body>
    <!-- Zoom Widget -->
    <div id="zoom-widget" class="zoom-widget roboto-mono-normal">
      <button id="zoom-minus" class="zoom-btn zoom-btn-minus" aria-label="Zoom out">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <span id="zoom-display" class="zoom-display">100%</span>
      <input id="zoom-input" type="number" class="zoom-input hidden" min="10" max="500" step="10" />
      <button id="zoom-plus" class="zoom-btn zoom-btn-plus" aria-label="Zoom in">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="12" y1="6" x2="12" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Recenter button: fades in when the artwork is panned off-screen -->
    <button id="recenter-btn" class="recenter-btn roboto-mono-normal" aria-label="Re-center image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 9V5a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M15 4h4a1 1 0 0 1 1 1v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 20H5a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      </svg>
      <span>Center</span>
    </button>

    <!-- Video transport: play/pause, scrub + trim window; visible in video mode only -->
    <div id="transport-bar" class="transport-bar roboto-mono-normal">
      <button id="transport-play" class="transport-btn" aria-label="Play / pause">
        <svg id="transport-icon-play" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 2.5v11l9-5.5z" fill="currentColor"/>
        </svg>
        <svg id="transport-icon-pause" class="hidden" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/>
          <rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <span id="transport-time" class="transport-time">0:00.0</span>
      <div id="transport-timeline" class="transport-timeline">
        <div id="trim-window" class="trim-window"></div>
        <div id="trim-in" class="trim-handle"></div>
        <div id="trim-out" class="trim-handle"></div>
        <div id="transport-playhead" class="transport-playhead"></div>
      </div>
      <span id="transport-clip-len" class="transport-time">0:30.0</span>
      <button id="transport-eject" class="transport-btn" aria-label="Close video">
        <svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Video export progress overlay -->
    <div id="export-overlay" class="export-overlay hidden roboto-mono-normal">
      <div class="export-dialog">
        <div id="export-title" class="export-title">Exporting…</div>
        <div class="export-progress"><div id="export-progress-fill"></div></div>
        <div id="export-status" class="export-status"></div>
        <button id="export-cancel" class="tile-upload-btn">Cancel</button>
      </div>
    </div>

    <div class="tile-panel-wrapper roboto-mono-normal">
      <div class="tile-panel">
        Tile Panel
        <div class="tile-pack-selector ">
          <select id="tile-pack-selector" name="tile-packs">
            <!-- <option value="default">Default</option>
            <option value="minesweeper">Minesweeper</option>
            <option value="pixel">Pixel</option> -->
          </select>
        </div>
        <button id="tile-upload-btn" class="tile-upload-btn">Upload Tile(s)</button>
        <div class="tile-stop-bar">

        </div>
        <div class="tile-stop-label">
          Stops
        </div>
        <div id="tile-stop-list">
          
        </div>

      </div>
    </div>
    <div>
      <script type="module" src="/src/main.js"></script>
    </div>
  </body>
</html>
